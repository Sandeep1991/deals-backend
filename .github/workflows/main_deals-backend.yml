# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - deals-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies into deployment venv
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          chmod +x startup.sh

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D4B69C7FDF9C4DA28DBEF467EE20B43C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_195F86C6E046449C95D60D8AFF53987A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E525B36AB238448D9936EB13B10F6245 }}
          allow-no-subscriptions: true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: deals-backend
          slot-name: Production
          startup-command: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120
          restart: true

      - name: Wait for SCM to stabilize
        run: sleep 30

      - name: Configure App Service settings
        run: |
          RG=$(az webapp list --query "[?name=='deals-backend'].resourceGroup | [0]" -o tsv)
          az webapp config appsettings set \
            --resource-group "$RG" \
            --name deals-backend \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true WEBSITES_PORT=8000
